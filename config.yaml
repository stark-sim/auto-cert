lego:
  # 尽量用个真邮箱
  email: gooda159753@163.com

  # 第一个域名会作为文件名
  domains:
    - www.starksim.com
    - gitlab.starksim.com
    - harbor.starksim.com

  # 私钥在 acme 代表一个用户，留空使用默认路径，如果有自己喜欢用的私钥就自己填 /path/to/your/private_key.[pem/key]
  private_key_path:

  # 保存证书文件们的文件夹路径，留空默认为当前目录
  crt_save_dir: .lego/certificates/

# 注意！私人信息非开发情况不要写在这里，建议使用 RAM 用户的 API_ACCESS_KEY
# Alarm! private info only for local development
aliyun:
  access_key: foo
  secret_key: bar

# 证书检查配置
check:
  # 提前多少天续期证书（设置为 0 或留空则总是续期）
  renew_before_days: 30

# 服务配置 - 定义证书部署到哪些服务
services:
  # Nginx 示例
  - name: nginx
    enabled: true
    # 使用哪个域名的证书（留空则使用第一个域名）
    domain: www.starksim.com
    # 部署目标路径
    targets:
      - cert_path: /etc/nginx/ssl/www.starksim.com.crt
        key_path: /etc/nginx/ssl/www.starksim.com.key
    # 部署后执行的重载命令
    reload_command: "nginx -s reload"
    # 是否在部署前备份现有证书
    backup: true

  # Dify 示例 - 特定文件名要求
  - name: dify
    enabled: false  # 设置为 true 启用
    domain: dify.starksim.com
    targets:
      - cert_path: /opt/dify/docker/nginx/ssl/dify.crt
        key_path: /opt/dify/docker/nginx/ssl/dify.key
    reload_command: "docker-compose -f /opt/dify/docker-compose.yml restart nginx"
    backup: true

  # GitLab 示例
  - name: gitlab
    enabled: false
    domain: gitlab.starksim.com
    targets:
      - cert_path: /etc/gitlab/ssl/gitlab.starksim.com.crt
        key_path: /etc/gitlab/ssl/gitlab.starksim.com.key
    reload_command: "gitlab-ctl hup nginx"
    backup: true

  # Harbor 示例
  - name: harbor
    enabled: false
    domain: harbor.starksim.com
    targets:
      - cert_path: /data/cert/harbor.starksim.com.crt
        key_path: /data/cert/harbor.starksim.com.key
    reload_command: "docker-compose -f /opt/harbor/docker-compose.yml restart proxy"
    backup: true

